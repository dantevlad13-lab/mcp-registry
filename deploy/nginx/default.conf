# DNS Docker: адрес приложения переопределяется, когда watchtower пересоздаёт контейнер
resolver 127.0.0.11 valid=10s ipv6=off;

upstream mcp_registry_app {
    zone mcp_registry_app 64k;
    server app:8787 resolve;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 64k;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json text/javascript;
    gzip_min_length 1024;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://mcp_registry_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host, а не $host: приложение сверяет Origin с Host вместе с портом
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
